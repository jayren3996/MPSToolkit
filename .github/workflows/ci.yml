name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:

# A newer push to the same branch makes the in-flight run obsolete. Never cancel on main:
# its runs are the record of what actually landed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        # "1.10" is the floor declared in Project.toml [compat]; "1" is the current stable
        # release. Testing both is what makes the compat bound a claim rather than a guess.
        version:
          - "1.10"
          - "1"

    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}

      - uses: julia-actions/cache@v3

      - uses: julia-actions/julia-buildpkg@v1

      - uses: julia-actions/julia-runtest@v1
