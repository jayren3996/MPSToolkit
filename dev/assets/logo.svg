<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="MPSToolkit.jl logo">
  <title>MPSToolkit.jl</title>
  <desc>A finite open-boundary matrix-product state in mixed-canonical form, acted on by a two-site gate at the orthogonality center.</desc>
  <!-- bonds, physical legs, and gate stubs (drawn behind the tensors) -->
  <g stroke="#9aa0a6" stroke-width="5" stroke-linecap="round" fill="none">
    <!-- virtual bond with open dangling ends (finite OBC MPS) -->
    <line x1="18" y1="172" x2="242" y2="172"/>
    <!-- physical legs, pointing down -->
    <line x1="52"  y1="172" x2="52"  y2="216"/>
    <line x1="104" y1="172" x2="104" y2="216"/>
    <line x1="156" y1="172" x2="156" y2="216"/>
    <line x1="208" y1="172" x2="208" y2="216"/>
    <!-- connectors from the inner sites up into the gate -->
    <line x1="104" y1="160" x2="104" y2="140"/>
    <line x1="156" y1="160" x2="156" y2="140"/>
  </g>
  <!-- two-site gate at the orthogonality center: Julia blue, the hero shape -->
  <rect x="92" y="104" width="76" height="36" rx="12" fill="#4063D8"/>
  <!-- mixed-canonical tensors: left-orthogonal triangles point right, right-orthogonal point left, toward the center -->
  <polygon points="32,151 32,193 73,172"   fill="#CB3C33"/>
  <polygon points="84,151 84,193 125,172"  fill="#389826"/>
  <polygon points="176,151 176,193 135,172" fill="#9558B2"/>
  <polygon points="228,151 228,193 187,172" fill="#CB3C33"/>
</svg>
